<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review packs</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root{--bg:#fafafa;--fg:#202020;--muted:#6b6b6b;--line:#d8d3cd;--accent:#5b3fa0;--code:#f1eef7;--th:#efeaf7}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.55 "Red Hat Text",system-ui,Segoe UI,sans-serif;color:var(--fg);background:var(--bg);display:grid;grid-template-columns:260px 1fr;min-height:100vh}
  nav{border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;background:#fff}
  nav h1{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
  nav a{display:block;padding:6px 8px;border-radius:6px;color:var(--fg);text-decoration:none;font-size:14px}
  nav a:hover{background:var(--code)} nav a.on{background:var(--accent);color:#fff}
  nav .sec{margin:14px 0 4px;font-size:12px;color:var(--muted)}
  main{padding:24px 40px 80px;max-width:1100px}
  main h1{font-size:26px;margin:0 0 8px} main h2{font-size:20px;margin:36px 0 10px;padding-top:14px;border-top:2px solid var(--line)} main h3{font-size:16px;margin:22px 0 6px}
  table{border-collapse:collapse;width:100%;margin:10px 0 18px;font-size:14px} th,td{border:1px solid var(--line);padding:6px 9px;vertical-align:top;text-align:left} th{background:var(--th)}
  code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:13px} pre code{display:block;padding:10px;overflow:auto}
  blockquote{margin:10px 0;padding:6px 14px;border-left:3px solid var(--accent);color:var(--muted)}
  hr{border:0;border-top:1px solid var(--line);margin:28px 0}
  .meta{color:var(--muted);font-size:13px;margin-bottom:18px}
  @media (max-width:800px){body{grid-template-columns:1fr}nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}main{padding:16px}}
</style>
</head>
<body>
<nav>
  <h1>Review packs</h1>
  <a href="#00 - Review Index.md" data-f="00 - Review Index.md">00 · Review Index</a>
  <div class="sec">Widgets</div>
  <div id="list"></div>
  <div class="sec">Decisions</div>
  <div id="decisions"></div>
</nav>
<main>
  <div class="meta" id="meta">Pick a pack on the left.</div>
  <article id="doc"></article>
</main>
<script>
(async function(){
  var map = await fetch('/_tools/widget-map.json',{cache:'no-store'}).then(function(r){return r.json();});
  var list = document.getElementById('list'), dec = document.getElementById('decisions');
  Object.keys(map.widgets).sort().forEach(function(k){
    var w = map.widgets[k];
    if (w.decided) { var d = document.createElement('a'); d.textContent = k + ' · ' + w.name + ' (decided)'; d.dataset.f = '../decisions/' + k + '.md'; d.href = '#' + d.dataset.f; dec.appendChild(d); return; }
    if (!(w.ours || w.jo)) return;
    var a = document.createElement('a'); var f = k + ' - ' + w.name.replace(/[\\/:*?"<>|]/g,'') + '.md';
    a.textContent = k + ' · ' + w.name; a.dataset.f = f; a.href = '#' + f; list.appendChild(a);
  });
  async function show(f){
    document.querySelectorAll('nav a').forEach(function(a){ a.classList.toggle('on', a.dataset.f === f); });
    var r = await fetch(encodeURI(f), {cache:'no-store'});
    if (!r.ok) { document.getElementById('doc').innerHTML = '<p>Not found: <code>' + f + '</code></p>'; return; }
    var md = await r.text();
    document.getElementById('doc').innerHTML = marked.parse(md);
    document.getElementById('meta').textContent = f + ' · fetched ' + new Date().toLocaleTimeString();
    /* the viewer's #w= link for this widget */
    var m = /^(W\d\d)/.exec(f.replace(/^\.\.\/decisions\//,'')); var meta = document.getElementById('meta');
    if (m) { var l = document.createElement('a'); l.href = '/index.html#w=' + m[1]; l.target = 'dash'; l.textContent = '  ·  open ' + m[1] + ' in the dashboard viewer'; meta.appendChild(l); }
    window.scrollTo(0,0);
  }
  function route(){ var f = decodeURIComponent(location.hash.slice(1)) || '00 - Review Index.md'; show(f); }
  window.addEventListener('hashchange', route); route();
})();
</script>
</body>
</html>
